<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amandarina.cl</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 20% 30%, #1a2a3a, #0b1219);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          "Segoe UI",
          "Poppins",
          system-ui,
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Roboto",
          sans-serif;
        padding: 1.5rem;
      }

      /* contenedor principal */
      .mirror-container {
        perspective: 1200px;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      /* TARJETA DIGITAL - efecto espejo/glassmorfismo */
      .digital-card {
        background: rgba(20, 28, 38, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 2.5rem;
        box-shadow:
          0 25px 45px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.15) inset,
          0 0 20px rgba(0, 255, 255, 0.2);
        padding: 1.5rem 1.5rem 1.5rem 1.5rem;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transform-style: preserve-3d;
      }

      .company-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2rem;
        font-weight: 800;
        color: #b7f0ff;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 1.2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 0.5rem;
      }

      .cart-status {
        background: rgba(0, 255, 255, 0.15);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        border: 1px solid rgba(0, 255, 255, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: normal;
        cursor: pointer;
      }

      #cartCount {
        font-weight: bold;
        color: #ffffff;
      }

      .cart-modal-overlay {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.65);
        z-index: 2000;
        padding: 1rem;
      }
      .cart-modal-overlay.active {
        display: flex;
      }
      .cart-modal {
        width: min(100%, 560px);
        max-height: calc(100vh - 2rem);
        overflow: hidden;
        background: rgba(10, 18, 28, 0.96);
        border-radius: 28px;
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
      }
      .modal-header h2 {
        font-size: 1.4rem;
        color: #e9f8ff;
        margin-bottom: 0.4rem;
      }
      .modal-header p {
        color: #a8cbd9;
        line-height: 1.5;
      }
      .cart-close {
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
      }
      .cart-items {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        padding-right: 0.25rem;
      }
      .cart-item {
        display: grid;
        grid-template-columns: 76px 1fr auto;
        gap: 0.9rem;
        align-items: center;
        padding: 1rem;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cart-item img {
        width: 76px;
        height: 76px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .item-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .item-info strong {
        color: #fff;
        font-size: 1rem;
      }
      .item-info span {
        color: #b7d7ec;
        font-size: 0.9rem;
      }
      .quantity-controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .quantity-controls button {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
      }
      .quantity-controls span {
        min-width: 24px;
        text-align: center;
        font-weight: 600;
        color: #fff;
      }
      .item-subtotal {
        color: #b7f0ff;
        font-weight: 700;
        text-align: right;
      }
      .cart-summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 0.75rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cart-summary-row strong {
        font-size: 1.1rem;
        color: #fff;
      }
      .cart-modal-actions {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .cart-clear-btn {
        flex: 1 1 auto;
        min-width: 150px;
        padding: 0.95rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: #f5faff;
        border-radius: 18px;
        cursor: pointer;
        font-size: 0.98rem;
        transition: all 0.2s ease;
      }
      .cart-clear-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .cart-empty-message {
        color: #acc3d0;
        text-align: center;
        font-size: 0.95rem;
        padding: 1.2rem 0;
      }
      @media (max-width: 550px) {
        .cart-modal {
          padding: 1rem;
        }
        .cart-item {
          grid-template-columns: 60px 1fr auto;
          padding: 0.9rem;
        }
        .cart-item img {
          width: 60px;
          height: 60px;
        }
      }

      /* imagen del producto con bordes brillantes */
      .product-image-wrapper {
        text-align: center;
        margin-bottom: 1.5rem;
        border-radius: 1.8rem;
        background: rgba(0, 0, 0, 0.25);
        padding: 8px; /* Mantener el padding para el borde */
        backdrop-filter: blur(2px);
        position: relative; /* Necesario para el posicionamiento absoluto de las imágenes */
        perspective: 1000px; /* Perspectiva para el efecto 3D */
        height: 256px; /* Altura fija para el contenedor de la imagen (240px + 8px*2 padding) */
      }

      /* Contenedor para el efecto flip */
      .product-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s; /* Velocidad de la animación flip */
        transform-style: preserve-3d; /* Permite que los elementos hijos se posicionen en 3D */
        border-radius: 1.5rem; /* Heredar o aplicar el border-radius */
      }

      /* Al pasar el mouse, gira el contenedor */
      .product-image-wrapper:hover .product-card-inner {
        transform: rotateY(180deg);
      }

      .product-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 1.5rem; /* Asegurar que las imágenes individuales también tengan bordes redondeados */
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        position: absolute;
        top: 0;
        left: 0;
        backface-visibility: hidden; /* Oculta la parte trasera de la imagen */
        -webkit-backface-visibility: hidden; /* Para compatibilidad con Safari */
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: #f0f0f0;
      }

      /* Flechas de navegación */
      .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: #b7f0ff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
        outline: none;
      }
      .nav-arrow:hover {
        background: rgba(0, 255, 255, 0.3);
        border-color: #00ffff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        color: white;
      }
      .nav-arrow.prev {
        left: 15px;
      }
      .nav-arrow.next {
        right: 15px;
      }

      .product-back {
        transform: rotateY(180deg);
      }

      /* info producto */
      .product-info {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .product-name {
        font-size: 1.9rem;
        font-weight: 700;
        background: linear-gradient(135deg, #ffffff, #b7f0ff);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.3px;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        margin-bottom: 0.6rem;
      }

      .product-price {
        font-size: 1.7rem;
        font-weight: 600;
        color: #ffe6b3;
        background: rgba(0, 0, 0, 0.4);
        display: inline-block;
        padding: 0.3rem 1rem;
        border-radius: 100px;
        backdrop-filter: blur(4px);
        font-family: monospace;
        letter-spacing: 1px;
        border: 1px solid rgba(255, 215, 0, 0.4);
      }

      .actions-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      /* botón comprar con estilo espejo */
      .btn-action {
        background: linear-gradient(105deg, #2c3e66, #1b2a47);
        border: none;
        width: 100%;
        padding: 0.9rem 0;
        font-size: 1.2rem;
        font-weight: bold;
        color: white;
        border-radius: 60px;
        cursor: pointer;
        transition: all 0.25s;
        box-shadow:
          0 8px 18px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        font-family: inherit;
        letter-spacing: 1px;
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 auto;
      }

      .buy-btn:hover {
        transform: scale(1.02);
        background: linear-gradient(105deg, #3a5180, #23355c);
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
        letter-spacing: 1.5px;
      }

      .card-footer {
        text-align: center;
        margin-top: 1.4rem;
        font-size: 0.75rem;
        color: #9bb5d0;
        opacity: 0.8;
        font-style: italic;
      }

      /* adaptación móvil */
      @media (max-width: 550px) {
        .digital-card {
          padding: 1.2rem;
        }
        .product-name {
          font-size: 1.5rem;
        }
        .product-price {
          font-size: 1.3rem;
        }
        .buy-btn {
          width: 100%;
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="mirror-container">
      <!-- TARJETA ÚNICA que contendrá los 10 productos (uno a la vez con efecto espejo) -->
      <div class="digital-card" id="digitalCard">
        <div class="company-header">

        <div class="product-image-wrapper">

              class="product-img product-front"
              alt="producto destacado"

              loading="eager"
            />
            <img
              id="productImageBack"
              class="product-img product-back"
              alt="producto destacado (reverso)"
              src=""
              loading="eager"
            />
          </div>
        </div>
        <div class="product-info">
          <div class="product-name" id="productName">Cargando...</div>
          <div class="product-price" id="productPrice">$---</div>
        </div>

          <button class="btn-action add-cart-btn" id="addToCartBtn">
            ➕ Añadir al Carrito
          </button>

          </button>
        </div>

    <div class="cart-modal-overlay" id="cartModal">
      <div class="cart-modal">
        <div class="modal-header">
          <div>
            <h2>Tu carrito</h2>
            <p>
              Revisa los productos añadidos y ajusta cantidades antes de
              finalizar tu pedido.
            </p>
          </div>
          <button
            class="cart-close"
            id="closeCartBtn"
            aria-label="Cerrar carrito"
          >
            ✕
          </button>
        </div>
        <div id="cartItemsContainer" class="cart-items"></div>
        <div id="cartEmptyMessage" class="cart-empty-message">
          Tu carrito está vacío.
        </div>
        <div class="cart-summary-row">
          <span>Total</span>
          <strong id="cartTotal">$0.00</strong>
        </div>
        <div class="cart-modal-actions">
          <button class="cart-clear-btn" id="clearCartBtn" type="button">
            🧹 Vaciar carrito
          </button>
          <button class="btn-action buy-btn" id="checkoutBtn">
            🛍️ Pasar a WhatsApp
          </button>
        </div>
      </div>
    </div>

    <script>
      // ======================== DATOS DE 10 PRODUCTOS ========================
      // IMPORTANTE: Verifica si tus imágenes son .jpg, .png o .jpeg y cámbialo aquí si es necesario.
      const productos = [
        { id: 1, nombre: "Kiwi", precio: 15.0, imagen: "./src/kiwi.jpeg" },
        { id: 2, nombre: "Limón", precio: 20.0, imagen: "./src/limon.jpeg" },
        {
          id: 3,
          nombre: "Mandarina",
          precio: 18.0,
          imagen: "./src/mandarina.jpeg",
        },
        {
          id: 4,
          nombre: "Manzana",
          precio: 22.0,
          imagen: "./src/manzana.jpeg",
        },
        { id: 5, nombre: "Pera", precio: 19.0, imagen: "./src/pera.jpeg" },
      ];

      // Índice actual (0 basado) = producto activo en la tarjeta
      let currentIndex = 0;
      const totalProducts = productos.length; // = 5

      // Elementos del DOM
      const productImageFrontEl = document.getElementById("productImageFront");
      const productImageBackEl = document.getElementById("productImageBack");
      const productNameEl = document.getElementById("productName");
      const productPriceEl = document.getElementById("productPrice");
      const buyButton = document.getElementById("buyButton");
      const addToCartBtn = document.getElementById("addToCartBtn");
      const cartCountEl = document.getElementById("cartCount");
      const imageWrapper = document.querySelector(".product-image-wrapper");
      const prevArrow = document.getElementById("prevArrow");
      const nextArrow = document.getElementById("nextArrow");
      const cartModal = document.getElementById("cartModal");
      const cartItemsContainer = document.getElementById("cartItemsContainer");
      const cartTotalEl = document.getElementById("cartTotal");
      const cartEmptyMessage = document.getElementById("cartEmptyMessage");
      const checkoutBtn = document.getElementById("checkoutBtn");
      const clearCartBtn = document.getElementById("clearCartBtn");
      const closeCartBtn = document.getElementById("closeCartBtn");
      const cartStatus = document.querySelector(".cart-status");
      let cart = {};

      function updateCartCount() {
        const cantidadTotal = Object.values(cart).reduce(
          (sum, item) => sum + item.qty,
          0,
        );
        cartCountEl.textContent = cantidadTotal;
      }

      function changeCartQuantity(productId, delta) {
        const item = cart[productId];
        if (!item) return;

        item.qty += delta;
        if (item.qty <= 0) {
          delete cart[productId];
        }
        updateCartDisplay();
      }

      function renderCartItems() {
        const items = Object.values(cart);
        if (items.length === 0) {
          cartItemsContainer.innerHTML = "";
          cartEmptyMessage.style.display = "block";
          cartTotalEl.textContent = "$0.00";
          checkoutBtn.disabled = true;
          checkoutBtn.style.opacity = "0.7";
          return;
        }

        cartEmptyMessage.style.display = "none";
        checkoutBtn.disabled = false;
        checkoutBtn.style.opacity = "1";

        let total = 0;
        cartItemsContainer.innerHTML = items
          .map((item) => {
            const subtotal = item.precio * item.qty;
            total += subtotal;
            return `
              <div class="cart-item">
                <img src="${item.imagen}" alt="${item.nombre}" />
                <div class="item-info">
                  <strong>${item.nombre}</strong>
                  <span>${new Intl.NumberFormat("es-ES", {
                    style: "currency",
                    currency: "USD",
                  }).format(item.precio)} x ${item.qty}</span>
                </div>
                <div>
                  <div class="quantity-controls">
                    <button type="button" data-id="${item.id}" data-action="decrease">−</button>
                    <span>${item.qty}</span>
                    <button type="button" data-id="${item.id}" data-action="increase">+</button>
                  </div>
                  <div class="item-subtotal">
                    ${new Intl.NumberFormat("es-ES", {
                      style: "currency",
                      currency: "USD",
                    }).format(subtotal)}
                  </div>
                </div>
              </div>
            `;
          })
          .join("");

        cartTotalEl.textContent = new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "USD",
        }).format(total);
      }

      function updateCartDisplay() {
        updateCartCount();
        renderCartItems();
      }

      function openCartModal() {
        updateCartDisplay();
        cartModal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeCartModal() {
        cartModal.classList.remove("active");
        document.body.style.overflow = "";
      }

      cartStatus.addEventListener("click", openCartModal);
      closeCartBtn.addEventListener("click", closeCartModal);
      cartModal.addEventListener("click", (event) => {
        if (event.target === cartModal) {
          closeCartModal();
        }
      });

      cartItemsContainer.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const productId = Number(button.dataset.id);
        const action = button.dataset.action;
        if (action === "increase") {
          changeCartQuantity(productId, 1);
        } else if (action === "decrease") {
          changeCartQuantity(productId, -1);
        }
      });

      clearCartBtn.addEventListener("click", () => {
        cart = {};
        updateCartDisplay();
      });

      // ----------------- FUNCIÓN PARA ACTUALIZAR LA TARJETA CON EL PRODUCTO ACTUAL -----------------
      function updateProductInfo(index) {
        const producto = productos[index];
        if (!producto) return;

        productNameEl.textContent = producto.nombre;
        const precioFormateado = new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
        }).format(producto.precio);
        productPriceEl.textContent = precioFormateado;
      }

      // CSS para los iconos de contacto
      const style = document.createElement("style");
      style.innerHTML = `
        .contact-item svg {
            width: 24px; /* Tamaño aumentado */
            height: 24px; /* Tamaño aumentado */
            flex-shrink: 0; /* Evita que el SVG se encoja */
        }
        .contact-item.whatsapp-link svg path {
            fill: #25D366; /* Verde de WhatsApp */
        }
        .contact-item.gmail-link svg path {
            fill: #EA4335; /* Rojo de Gmail */
        }
      `;
      document.head.appendChild(style);

      function initGallery() {
        if (productos.length > 0) {
          productImageFrontEl.src = productos[0].imagen;
          productImageFrontEl.alt = productos[0].nombre;
          if (productos.length > 1) {
            productImageBackEl.src = productos[1].imagen;
            productImageBackEl.alt = productos[1].nombre;
          }
          updateProductInfo(0);
        }
      }

      // Ayuda para depurar: avisar si una imagen no existe
      productImageFrontEl.onerror = () =>
        console.error("Error cargando frontal:", productImageFrontEl.src);
      productImageBackEl.onerror = () =>
        console.error("Error cargando trasera:", productImageBackEl.src);

      // Al girar (Entra el mouse): Avanzamos al siguiente producto que se verá atrás
      imageWrapper.addEventListener("mouseenter", () => {
        currentIndex = (currentIndex + 1) % totalProducts;
        productImageBackEl.src = productos[currentIndex].imagen;
        productImageBackEl.alt = `Imagen de ${productos[currentIndex].nombre}`;
        updateProductInfo(currentIndex);
      });

      // Al regresar (Sale el mouse): Avanzamos al siguiente producto que se verá adelante
      imageWrapper.addEventListener("mouseleave", () => {
        // Sincronizamos la imagen frontal con el producto actual
        // para que no cambie de nuevo al retirar el mouse
        productImageFrontEl.src = productos[currentIndex].imagen;
        productImageFrontEl.alt = `Imagen de ${productos[currentIndex].nombre}`;
      });

      // Navegación con flechas
      prevArrow.addEventListener("click", (e) => {
        e.stopPropagation(); // Evita conflictos con el hover del contenedor
        currentIndex = (currentIndex - 1 + totalProducts) % totalProducts;
        updateProductInfo(currentIndex);
        // Sincronizamos ambas imágenes para una navegación coherente
        productImageFrontEl.src = productos[currentIndex].imagen;
        productImageBackEl.src = productos[currentIndex].imagen;
      });

      nextArrow.addEventListener("click", (e) => {
        e.stopPropagation();
        currentIndex = (currentIndex + 1) % totalProducts;
        updateProductInfo(currentIndex);
        productImageFrontEl.src = productos[currentIndex].imagen;
        productImageBackEl.src = productos[currentIndex].imagen;
      });

      // ---------- CARRITO: Lógica de añadir y pagar ----------

      addToCartBtn.addEventListener("click", () => {
        const productoActual = productos[currentIndex];
        const productId = productoActual.id;

        if (cart[productId]) {
          cart[productId].qty += 1;
        } else {
          cart[productId] = { ...productoActual, qty: 1 };
        }

        updateCartDisplay();

        // Feedback visual
        addToCartBtn.textContent = "✅ ¡Añadido!";
        setTimeout(() => {
          addToCartBtn.textContent = "➕ Añadir al Carrito";
        }, 1000);
      });

      function handleBuy() {
        const items = Object.values(cart);
        if (items.length === 0) {
          alert("El carrito está vacío. ¡Añade algunos productos primero!");
          return;
        }

        const formatter = new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "USD",
        });

        let total = 0;
        const itemsList = items
          .map((item, index) => {
            const subtotal = item.precio * item.qty;
            total += subtotal;
            return `${index + 1}. ${item.nombre} x${item.qty} (${formatter.format(
              subtotal,
            )})`;
          })
          .join("\n");

        const message = `Hola amandarina.cl! 👋\nQuiero realizar el siguiente pedido:\n\n${itemsList}\n\n━━━━━━━━━━━━━━\nTotal: ${formatter.format(total)}`;

        const whatsappURL = `https://wa.me/513114454660?text=${encodeURIComponent(
          message,
        )}`;
        window.open(whatsappURL, "_blank");
      }

      checkoutBtn.addEventListener("click", handleBuy);
      buyButton.addEventListener("click", () => {
        if (Object.values(cart).length === 0) {
          alert("El carrito está vacío. ¡Añade algunos productos primero!");
          return;
        }
        openCartModal();
      });

      // ---------- EVENTOS Y CARGA INICIAL ----------
      // Inicializar la tarjeta con el primer producto (índice 0)
      initGallery();

      // El console.log ya no es relevante ya que solo se muestra un producto
      // console.log(`Tarjeta espejo cargada con ${totalProducts} productos únicos.`);
    </script>
  </body>
</html>
