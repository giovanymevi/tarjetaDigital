<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amandarina.cl</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 20% 30%, #1a2a3a, #0b1219);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          "Segoe UI",
          "Poppins",
          system-ui,
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Roboto",
          sans-serif;
        padding: 1.5rem;
      }

      /* contenedor principal */
      .mirror-container {
        perspective: 1200px;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      /* TARJETA DIGITAL - efecto espejo/glassmorfismo */
      .digital-card {
        background: rgba(20, 28, 38, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 2.5rem;
        box-shadow:
          0 25px 45px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.15) inset,
          0 0 20px rgba(0, 255, 255, 0.2);
        padding: 1.5rem 1.5rem 1.5rem 1.5rem;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transform-style: preserve-3d;
      }

      .company-header {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 800;
        color: #b7f0ff;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 1.2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 0.5rem;
      }

      /* imagen del producto con bordes brillantes */
      .product-image-wrapper {
        text-align: center;
        margin-bottom: 1.5rem;
        border-radius: 1.8rem;
        background: rgba(0, 0, 0, 0.25);
        padding: 8px; /* Mantener el padding para el borde */
        backdrop-filter: blur(2px);
        position: relative; /* Necesario para el posicionamiento absoluto de las imágenes */
        perspective: 1000px; /* Perspectiva para el efecto 3D */
        height: 256px; /* Altura fija para el contenedor de la imagen (240px + 8px*2 padding) */
      }

      /* Contenedor para el efecto flip */
      .product-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s; /* Velocidad de la animación flip */
        transform-style: preserve-3d; /* Permite que los elementos hijos se posicionen en 3D */
        border-radius: 1.5rem; /* Heredar o aplicar el border-radius */
      }

      /* Al pasar el mouse, gira el contenedor */
      .product-image-wrapper:hover .product-card-inner {
        transform: rotateY(180deg);
      }

      .product-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 1.5rem; /* Asegurar que las imágenes individuales también tengan bordes redondeados */
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        position: absolute;
        top: 0;
        left: 0;
        backface-visibility: hidden; /* Oculta la parte trasera de la imagen */
        -webkit-backface-visibility: hidden; /* Para compatibilidad con Safari */
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: #f0f0f0;
      }

      /* Flechas de navegación */
      .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: #b7f0ff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
        outline: none;
      }
      .nav-arrow:hover {
        background: rgba(0, 255, 255, 0.3);
        border-color: #00ffff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        color: white;
      }
      .nav-arrow.prev { left: 15px; }
      .nav-arrow.next { right: 15px; }

      .product-back {
        transform: rotateY(180deg);
      }

      /* info producto */
      .product-info {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .product-name {
        font-size: 1.9rem;
        font-weight: 700;
        background: linear-gradient(135deg, #ffffff, #b7f0ff);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.3px;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        margin-bottom: 0.6rem;
      }

      .product-price {
        font-size: 1.7rem;
        font-weight: 600;
        color: #ffe6b3;
        background: rgba(0, 0, 0, 0.4);
        display: inline-block;
        padding: 0.3rem 1rem;
        border-radius: 100px;
        backdrop-filter: blur(4px);
        font-family: monospace;
        letter-spacing: 1px;
        border: 1px solid rgba(255, 215, 0, 0.4);
      }

      /* botón comprar con estilo espejo */
      .buy-btn {
        background: linear-gradient(105deg, #2c3e66, #1b2a47);
        border: none;
        width: 85%;
        padding: 0.9rem 0;
        font-size: 1.35rem;
        font-weight: bold;
        color: white;
        border-radius: 60px;
        cursor: pointer;
        transition: all 0.25s;
        box-shadow:
          0 8px 18px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        font-family: inherit;
        letter-spacing: 1px;
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 auto;
      }

      .buy-btn:hover {
        transform: scale(1.02);
        background: linear-gradient(105deg, #3a5180, #23355c);
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
        letter-spacing: 1.5px;
      }

      .card-footer {
        text-align: center;
        margin-top: 1.4rem;
        font-size: 0.75rem;
        color: #9bb5d0;
        opacity: 0.8;
        font-style: italic;
      }

      /* adaptación móvil */
      @media (max-width: 550px) {
        .digital-card {
          padding: 1.2rem;
        }
        .product-name {
          font-size: 1.5rem;
        }
        .product-price {
          font-size: 1.3rem;
        }
        .buy-btn {
          width: 100%;
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="mirror-container">
      <!-- TARJETA ÚNICA que contendrá los 10 productos (uno a la vez con efecto espejo) -->
      <div class="digital-card" id="digitalCard">
        <div class="company-header">amandarina.cl</div>
        <div class="product-image-wrapper">
          <button class="nav-arrow prev" id="prevArrow" title="Anterior">❮</button>
          <button class="nav-arrow next" id="nextArrow" title="Siguiente">❯</button>
          <div class="product-card-inner">
            <img
              id="productImageFront"
              class="product-img product-front"
              alt="producto destacado"
              src=""
              loading="eager"
            />
            <img
              id="productImageBack"
              class="product-img product-back"
              alt="producto destacado (reverso)"
              src=""
              loading="eager"
            />
          </div>
        </div>
        <div class="product-info">
          <div class="product-name" id="productName">Cargando...</div>
          <div class="product-price" id="productPrice">$---</div>
        </div>
        <button class="buy-btn" id="buyButton">🛒 COMPRAR AHORA</button>

        <div class="card-footer">
          <a
            href="https://wa.me/513114454660"
            class="contact-item whatsapp-link"
          >
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"
              />
            </svg>
            +51 311 445 4660
          </a>
          <a
            href="mailto:amandarina.cl@gmail.com"
            class="contact-item gmail-link"
          >
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M0 3v18h24v-18h-24zm6.623 7.929l-4.623 5.712v-9.458l4.623 3.746zm-4.141-5.929h19.035l-9.517 7.713-9.518-7.713zm5.694 4.612l1.324 1.074 1.324-1.074 4.623 3.746h-11.894l4.623-3.746zm7.377-1.334l4.623-3.746v9.458l-4.623-5.712z"
              />
            </svg>
            amandarina.cl@gmail.com
          </a>
          <span class="responsible-name">Responsable: Giovanny Mendoza</span>
        </div>
      </div>
    </div>

    <script>
      // ======================== DATOS DE 10 PRODUCTOS ========================
      // IMPORTANTE: Verifica si tus imágenes son .jpg, .png o .jpeg y cámbialo aquí si es necesario.
      const productos = [
        { id: 1, nombre: "kiwi", precio: 15.0, imagen: "./src/kiwi.jpeg" },
        { id: 2, nombre: "limon", precio: 20.0, imagen: "./src/limon.jpeg" },
        { id: 3, nombre: "Producto 03", precio: 12.5, imagen: "./src/3.jpg" },
        { id: 4, nombre: "Producto 04", precio: 45.0, imagen: "./src/4.jpg" },
        { id: 5, nombre: "Producto 05", precio: 30.0, imagen: "./src/5.jpg" },
        { id: 6, nombre: "Producto 06", precio: 22.0, imagen: "./src/6.jpg" },
        { id: 7, nombre: "Producto 07", precio: 18.0, imagen: "./src/7.jpg" },
        { id: 8, nombre: "Producto 08", precio: 50.0, imagen: "./src/8.jpg" },
        { id: 9, nombre: "Producto 09", precio: 35.0, imagen: "./src/9.jpg" },
        { id: 10, nombre: "Producto 10", precio: 40.0, imagen: "./src/10.jpg" },
      ];

      // Índice actual (0 basado) = producto activo en la tarjeta
      let currentIndex = 0;
      const totalProducts = productos.length; // = 10

      // Elementos del DOM
      const productImageFrontEl = document.getElementById("productImageFront");
      const productImageBackEl = document.getElementById("productImageBack");
      const productNameEl = document.getElementById("productName");
      const productPriceEl = document.getElementById("productPrice");
      const buyButton = document.getElementById("buyButton");
      const imageWrapper = document.querySelector(".product-image-wrapper");
      const prevArrow = document.getElementById("prevArrow");
      const nextArrow = document.getElementById("nextArrow");

      // ----------------- FUNCIÓN PARA ACTUALIZAR LA TARJETA CON EL PRODUCTO ACTUAL -----------------
      function updateProductInfo(index) {
        const producto = productos[index];
        if (!producto) return;

        productNameEl.textContent = producto.nombre;
        const precioFormateado = new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
        }).format(producto.precio);
        productPriceEl.textContent = precioFormateado;
      }

      // CSS para los iconos de contacto
      const style = document.createElement("style");
      style.innerHTML = `
        .contact-item svg {
            width: 24px; /* Tamaño aumentado */
            height: 24px; /* Tamaño aumentado */
            flex-shrink: 0; /* Evita que el SVG se encoja */
        }
        .contact-item.whatsapp-link svg path {
            fill: #25D366; /* Verde de WhatsApp */
        }
        .contact-item.gmail-link svg path {
            fill: #EA4335; /* Rojo de Gmail */
        }
      `;
      document.head.appendChild(style);

      function initGallery() {
        if (productos.length > 0) {
          productImageFrontEl.src = productos[0].imagen;
          productImageFrontEl.alt = productos[0].nombre;
          if (productos.length > 1) {
            productImageBackEl.src = productos[1].imagen;
            productImageBackEl.alt = productos[1].nombre;
          }
          updateProductInfo(0);
        }
      }

      // Ayuda para depurar: avisar si una imagen no existe
      productImageFrontEl.onerror = () =>
        console.error("Error cargando frontal:", productImageFrontEl.src);
      productImageBackEl.onerror = () =>
        console.error("Error cargando trasera:", productImageBackEl.src);

      // Al girar (Entra el mouse): Avanzamos al siguiente producto que se verá atrás
      imageWrapper.addEventListener("mouseenter", () => {
        currentIndex = (currentIndex + 1) % totalProducts;
        productImageBackEl.src = productos[currentIndex].imagen;
        productImageBackEl.alt = `Imagen de ${productos[currentIndex].nombre}`;
        updateProductInfo(currentIndex);
      });

      // Al regresar (Sale el mouse): Avanzamos al siguiente producto que se verá adelante
      imageWrapper.addEventListener("mouseleave", () => {
        // Sincronizamos la imagen frontal con el producto actual
        // para que no cambie de nuevo al retirar el mouse
        productImageFrontEl.src = productos[currentIndex].imagen;
        productImageFrontEl.alt = `Imagen de ${productos[currentIndex].nombre}`;
      });

      // Navegación con flechas
      prevArrow.addEventListener("click", (e) => {
        e.stopPropagation(); // Evita conflictos con el hover del contenedor
        currentIndex = (currentIndex - 1 + totalProducts) % totalProducts;
        updateProductInfo(currentIndex);
        // Sincronizamos ambas imágenes para una navegación coherente
        productImageFrontEl.src = productos[currentIndex].imagen;
        productImageBackEl.src = productos[currentIndex].imagen;
      });

      nextArrow.addEventListener("click", (e) => {
        e.stopPropagation();
        currentIndex = (currentIndex + 1) % totalProducts;
        updateProductInfo(currentIndex);
        productImageFrontEl.src = productos[currentIndex].imagen;
        productImageBackEl.src = productos[currentIndex].imagen;
      });

      // ---------- COMPRAR: muestra alerta con los datos del producto actual (nombre y precio) ----------
      function handleBuy() {
        const productoActual = productos[currentIndex];
        if (productoActual) {
          const precioFormateado = new Intl.NumberFormat("es-ES", {
            style: "currency",
            currency: "USD",
            minimumFractionDigits: 2,
          }).format(productoActual.precio);
          const whatsappMessage = `Hola! Estoy interesado en el producto: ${productoActual.nombre} - ${precioFormateado}`;
          const whatsappURL = `https://wa.me/513114454660?text=${encodeURIComponent(whatsappMessage)}`;
          window.open(whatsappURL, "_blank");
        } else {
          alert("Producto no encontrado");
        }
      }

      // ---------- EVENTOS Y CARGA INICIAL ----------
      // Asignar eventos a los botones (comprar + navegación)
      buyButton.addEventListener("click", handleBuy);

      // Inicializar la tarjeta con el primer producto (índice 0)
      initGallery();

      // El console.log ya no es relevante ya que solo se muestra un producto
      // console.log(`Tarjeta espejo cargada con ${totalProducts} productos únicos.`);
    </script>
  </body>
</html>
